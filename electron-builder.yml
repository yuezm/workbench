appId: com.workbench.desktop
productName: Workbench
copyright: Copyright © 2026 Workbench

directories:
  output: dist
  buildResources: resources

# 只打包构建产物与清单，源码/测试/配置不打进安装包
files:
  - out/**/*
  - package.json

# 托盘图标（主进程从 process.resourcesPath 读取）。
# 注意：extraResources 的字符串路径相对 buildResources 解析，这里
# buildResources 也是 resources/，必须用 from/to 显式指定，否则静默漏拷。
extraResources:
  - from: resources/tray.png
    to: tray.png

# 国内网络：从 npmmirror 拉取 Electron 二进制
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 工作台
  deleteAppDataOnUninstall: false
  artifactName: ${name}-${version}-setup.${ext}

portable:
  artifactName: ${name}-${version}-portable.${ext}
